openapi: 3.0.3
info:
  title: Film Contest API Specification
  description: Danh mục REST API của Film Contest. x-implementation đánh dấu route đang mount (mounted) hoặc hợp
    đồng module chưa có route (planned). Route đang mount có thể còn lệch nghiệp vụ SRS.
    Route dùng BearerAuth kiểm tra chữ ký, hạn JWT và trạng thái hoạt động của tài khoản.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local Development Server
paths:
  /api/v1/ai/webhook:
    post:
      summary: Nhận kết quả phân tích từ dịch vụ AI
      description: predictedTags nhận tối đa 5 phần tử. Payload có nhiều hơn 5 thẻ trả 400.
      tags:
      - AI Webhook
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Payload vượt 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook chưa được cấu hình
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - AiWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - submissionId
              - phashHex
              - aiGeneratedProbability
              - predictedTags
              properties:
                submissionId:
                  type: string
                  format: uuid
                phashHex:
                  type: string
                  pattern: ^[0-9a-fA-F]{16}$
                aiGeneratedProbability:
                  type: number
                  minimum: 0
                  maximum: 1
                predictedTags:
                  type: array
                  items:
                    type: object
                    required:
                    - tag
                    - confidence
                    properties:
                      tag:
                        type: string
                        minLength: 1
                        maxLength: 100
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
                  maxItems: 5
      x-implementation: mounted
      operationId: postAiWebhook
  /api/v1/auth/forgot-password:
    post:
      summary: POST /api/v1/auth/forgot-password
      description: Hợp đồng dự kiến trong [01-auth-and-rbac.md](ai/01-auth-and-rbac.md). Route chưa được đăng ký trong
        Hono.
      tags:
      - Planned · 01
      x-implementation: planned
      responses:
        default:
          description: Xem hợp đồng request và response trong module liên kết.
      operationId: postAuthForgotPassword
  /api/v1/auth/login:
    post:
      summary: Đăng nhập hệ thống
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: participant@example.com
                password:
                  type: string
                  example: SecurePass123!
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserResponse'
                        accessToken:
                          type: string
                        refreshToken:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tài khoản đã bị khoá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implementation: mounted
      operationId: postAuthLogin
  /api/v1/auth/logout:
    post:
      summary: Đăng xuất và thu hồi Refresh Token
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      nullable: true
                      enum:
                      - null
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implementation: mounted
      operationId: postAuthLogout
  /api/v1/auth/me:
    get:
      summary: Thông tin tài khoản hiện tại
      tags:
      - Auth
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - BearerAuth: []
      x-implementation: mounted
      operationId: getAuthMe
  /api/v1/auth/portfolio:
    get:
      summary: Portfolio của tài khoản hiện tại
      description: Chỉ Participant được đọc portfolio của mình.
      tags:
      - Auth
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserResponse'
                        stats:
                          type: object
                        awards:
                          type: array
                          items:
                            type: object
                        curatedWorks:
                          type: array
                          items:
                            type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

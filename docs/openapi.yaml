        code:
          type: string
          example: CON-2026-01
        registrationStartAt:
          type: string
          format: date-time
          nullable: true
        submissionDeadlineAt:
          type: string
          format: date-time
          nullable: true
        judgingStartAt:
          type: string
          format: date-time
          nullable: true
        judgingDeadlineAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        theme:
          type: string
          nullable: true
        rules:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/ContestRound'
        awards:
          type: array
          items:
            $ref: '#/components/schemas/ContestAward'
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 150
        description:
          type: string
          nullable: true
        status:
          type: string
        startAt:
          type: string
          format: date-time
          nullable: true
        endAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

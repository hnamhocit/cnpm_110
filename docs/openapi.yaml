openapi: 3.0.3
info:
  title: Film Contest API Specification
  description: Danh mục REST API của Film Contest. x-implementation đánh dấu route đang mount (mounted) hoặc hợp
    đồng module chưa có route (planned). Route đang mount có thể còn lệch nghiệp vụ SRS.
    Route dùng BearerAuth kiểm tra chữ ký, hạn JWT, phiên bản, phiên và trạng thái hoạt động của tài khoản.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local Development Server
paths:
  /api/v1/ai/webhook:
    post:
      summary: Nhận kết quả phân tích từ dịch vụ AI
      description: predictedTags nhận tối đa 5 phần tử. Payload có nhiều hơn 5 thẻ trả 400.
      tags:
      - AI Webhook
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Payload vượt 64 KiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Webhook chưa được cấu hình
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - AiWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - submissionId
              - phashHex
              - aiGeneratedProbability
              - predictedTags
              properties:
                submissionId:
                  type: string
                  format: uuid
                phashHex:
                  type: string
                  pattern: ^[0-9a-fA-F]{16}$
                aiGeneratedProbability:
                  type: number
                  minimum: 0
                  maximum: 1
                predictedTags:
                  type: array
                  items:
                    type: object
                    required:
                    - tag
                    - confidence
                    properties:
                      tag:
                        type: string
                        minLength: 1
                        maxLength: 100
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
                  maxItems: 5
      x-implementation: mounted
      operationId: postAiWebhook
  /api/v1/auth/forgot-password:
    post:
      summary: "Yêu cầu đặt lại mật khẩu"
      description: "Phản hồi chung cho mọi email hợp lệ. Chỉ tài khoản đang hoạt động có email đã xác thực nhận link."
      tags:
      - Authentication
      x-implementation: mounted
      operationId: postAuthForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"email": {"type": "string", "format": "email", "maxLength": 255}}, "required": ["email"]}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/SuccessEnvelope"}
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/login:
    post:
      summary: Đăng nhập hệ thống
      description: Trả 401 với message EMAIL_VERIFICATION_REQUIRED khi mật khẩu đúng và email chưa xác minh. Client có thể hiện bước nhập mã hoặc gửi lại mã theo yêu cầu.
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: participant@example.com
                password:
                  type: string
                  example: SecurePass123!
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserResponse'
                        accessToken:
                          type: string
                        refreshToken:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Mật khẩu đúng và tài khoản bị khóa. Trường message có giá trị ACCOUNT_LOCKED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implementation: mounted
      operationId: postAuthLogin
  /api/v1/auth/logout:
    post:
      summary: Đăng xuất và thu hồi Refresh Token
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      nullable: true
                      enum:
                      - null
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implementation: mounted
      operationId: postAuthLogout
  /api/v1/auth/me:
    get:
      summary: Thông tin tài khoản hiện tại
      tags:
      - Auth
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - BearerAuth: []
      x-implementation: mounted
      operationId: getAuthMe
  /api/v1/auth/portfolio:
    get:
      summary: Portfolio của tài khoản hiện tại
      description: Chỉ Participant được đọc portfolio của mình.
      tags:
      - Auth
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserResponse'
                        stats:
                          type: object
                        awards:
                          type: array
                          items:
                            type: object
                        curatedWorks:
                          type: array
                          items:
                            type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - BearerAuth: []
      x-implementation: mounted
      operationId: getAuthPortfolio
  /api/v1/auth/refresh:
    post:
      summary: Cấp mới Access Token bằng Refresh Token (Token Rotation)
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 6N7K4nFzD-example-token
      responses:
        '200':
          description: Cấp token mới thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
                        refreshToken:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token không hợp lệ hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implementation: mounted
      operationId: postAuthRefresh
  /api/v1/auth/register:
    post:
      summary: "Đăng ký Participant"
      description: "Tạo tài khoản chờ xác thực và gửi OTP qua email. Xác thực email rồi số điện thoại trước khi đăng nhập."
      tags:
      - Authentication
      x-implementation: mounted
      operationId: postAuthRegister
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"fullName": {"type": "string", "minLength": 2, "maxLength": 100}, "email": {"type": "string", "format": "email", "maxLength": 255}, "phoneNumber": {"type": "string", "description": "E.164 hoặc số Việt Nam 10 chữ số", "maxLength": 16}, "password": {"type": "string", "format": "password", "minLength": 8, "maxLength": 128}}, "required": ["fullName", "email", "password"]}
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema: {"allOf": [{"$ref": "#/components/schemas/SuccessEnvelope"}, {"type": "object", "properties": {"data": {"type": "object", "properties": {"user": {"$ref": "#/components/schemas/UserResponse"}, "status": {"type": "string", "enum": ["PENDING_VERIFICATION"]}, "deliveryStatus": {"type": "string", "enum": ["ACCEPTED", "RETRY_REQUIRED"]}}}}}]}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Không thực hiện được thao tác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Không thực hiện được thao tác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/auth/reset-password:
    post:
      summary: "Đặt lại mật khẩu"
      description: "Token nhận qua email dùng một lần trong 15 phút. Thu hồi toàn bộ phiên khi thành công."
      tags:
      - Authentication
      x-implementation: mounted
      operationId: postAuthResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"token": {"type": "string", "minLength": 43, "maxLength": 43}, "newPassword": {"type": "string", "format": "password", "minLength": 8, "maxLength": 128}, "confirmPassword": {"type": "string", "format": "password", "minLength": 8, "maxLength": 128}}, "required": ["token", "newPassword", "confirmPassword"]}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/SuccessEnvelope"}
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/verify-email:
    post:
      summary: "Xác thực email"
      description: "Xác thực mã email và kích hoạt tài khoản."
      tags:
      - Authentication
      x-implementation: mounted
      operationId: postAuthVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"email": {"type": "string", "format": "email", "maxLength": 255}, "code": {"type": "string", "pattern": "^[0-9]{6}$"}}, "required": ["email", "code"]}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {"allOf": [{"$ref": "#/components/schemas/SuccessEnvelope"}, {"type": "object", "properties": {"data": {"type": "object", "properties": {"status": {"type": "string", "enum": ["ACTIVE"]}}}}}]}
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/resend-verification:
    post:
      summary: "Gửi lại mã xác thực email"
      description: "Yêu cầu mật khẩu tài khoản và áp dụng thời gian chờ giữa các lần gửi."
      tags:
      - Authentication
      x-implementation: mounted
      operationId: postAuthResendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {"email": {"type": "string", "format": "email", "maxLength": 255}, "password": {"type": "string", "format": "password", "minLength": 8, "maxLength": 128}}, "required": ["email", "password"]}
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: {"allOf": [{"$ref": "#/components/schemas/SuccessEnvelope"}, {"type": "object", "properties": {"data": {"type": "object", "properties": {"deliveryStatus": {"type": "string", "enum": ["ACCEPTED", "RETRY_REQUIRED"]}}}}}]}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Không thực hiện được thao tác
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/contests/{id}/analytics:
    get:
      summary: Báo cáo cuộc thi UC-28
      description: Đọc thống kê tổng hợp từ PostgreSQL.
      operationId: getContestAnalytics
      x-implementation: mounted
      tags: [Contests]
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Số liệu tổng hợp và nhận xét
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        contest:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                        totals:
                          $ref: '#/components/schemas/ContestAnalyticsCounts'
                        categories:
                          type: array
                          items:
                            allOf:
                            - $ref: '#/components/schemas/ContestAnalyticsCounts'
                            - type: object
                              properties:
                                name: { type: string }
                        report: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Cuộc thi không tồn tại hoặc ngoài phạm vi quản lý
    post:
      summary: Báo cáo cuộc thi UC-28
      description: Tạo nhận xét AI từ số liệu tổng hợp. Khi AI lỗi, nhận xét là null và số liệu vẫn được trả.
      operationId: generateContestAnalytics
      x-implementation: mounted
      tags: [Contests]
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Số liệu tổng hợp và nhận xét
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        contest:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                        totals:
                          $ref: '#/components/schemas/ContestAnalyticsCounts'
                        categories:
                          type: array
                          items:
                            allOf:
                            - $ref: '#/components/schemas/ContestAnalyticsCounts'
                            - type: object
                              properties:
                                name: { type: string }
                        report: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Cuộc thi không tồn tại hoặc ngoài phạm vi quản lý
  /api/v1/contests:
    get:
      summary: Lấy danh sách cuộc thi đang mở
      tags:
      - Contests
      parameters:
      - name: search
        in: query
        schema:
          type: string
        description: Tìm theo tên cuộc thi
      - name: status
        in: query
        schema:
          type: string
        description: Lọc theo trạng thái
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: createdBy
        in: query
        schema:
          type: string
          format: uuid
      - name: created_by
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Danh sách cuộc thi
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/Contest'
                        pagination:
                          $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implementation: mounted
      operationId: getContests
    post:
      summary: Tạo cuộc thi
      tags:
      - Contests
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestInput'
      responses:
        '201':
          description: Tạo cuộc thi thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 201
                    data:
                      $ref: '#/components/schemas/Contest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Tạo cấu hình đầy đủ bằng năm mốc BR-08. Payload startAt/endAt chỉ tạo bản nháp tương thích.
      x-implementation: mounted
      operationId: postContests
  /api/v1/contests/{id}:
    delete:
      summary: Xoá cuộc thi
      description: Xóa mềm. Organizer chỉ xóa cuộc thi do mình tạo. Cuộc thi đã công bố, hoàn tất, lưu trữ hoặc ngoài phạm vi trả 404.
      tags:
      - Contests
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ContestId'
      responses:
        '200':
          description: Xoá cuộc thi thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: mounted
      operationId: deleteContestsById
    get:
      summary: Lấy chi tiết cuộc thi
      tags:
      - Contests
      parameters:
      - $ref: '#/components/parameters/ContestId'
      responses:
        '200':
          description: Chi tiết cuộc thi
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      $ref: '#/components/schemas/Contest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: mounted
      operationId: getContestsById
    put:
      summary: Cập nhật cuộc thi
      description: Organizer chỉ thao tác trong cuộc thi do mình tạo. Cuộc thi đã công bố, hoàn tất hoặc lưu trữ trả 403.
      tags:
      - Contests
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ContestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ContestInput'
              description: Gửi ít nhất một field cần cập nhật.
      responses:
        '200':
          description: Cập nhật cuộc thi thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      $ref: '#/components/schemas/Contest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation: mounted
      operationId: putContestsById
  /api/v1/contests/{id}/archive:
    post:
      summary: POST /api/v1/contests/{id}/archive
      description: Hợp đồng dự kiến trong [08-archive-and-exhibition.md](ai/08-archive-and-exhibition.md). Route chưa
        được đăng ký trong Hono.
      tags:
      - Planned · 08
      x-implementation: planned
      responses:
        default:
          description: Xem hợp đồng request và response trong module liên kết.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      operationId: postContestsByIdArchive
  /api/v1/contests/{id}/categories:
    get:
      summary: Hạng mục cuộc thi
      tags:
      - Contests
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ContestCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implementation: mounted
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      operationId: getContestsByIdCategories
    post:
      summary: Tạo hạng mục
      tags:
      - Contests
      security:
      - BearerAuth: []
      x-implementation: mounted
      operationId: postContestCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContestCategoryCreate'
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:

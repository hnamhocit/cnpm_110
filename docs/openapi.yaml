        endAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContestInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          example: Hanoi Analog Film Contest
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
          nullable: true
        endAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          default: draft
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    SubmissionForm:
      type: object
      required:
      - contestId
      - categoryId
      - title
      - filmBrand
      - filmStock
      - filmFormat
      - isoRated
      - isoShot
      - cameraBody
      - image
      - rollId
      - frameNumber
      anyOf:
      - required: [devLabName]
      - required: [devChemistry]
      properties:
        contestId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        filmBrand:
          type: string
          maxLength: 100
        filmStock:
          type: string
          maxLength: 150
        filmFormat:
          type: string
          enum: ['135', '120_645', '120_66', '120_67', '4x5']
        isoRated:
          type: integer
          minimum: 1
        isoShot:
          type: integer
          minimum: 1
        cameraBody:
          type: string
          maxLength: 150
        lens:
          type: string
          maxLength: 150
        rollId:
          type: string
          maxLength: 100
        frameNumber:
          type: string
          pattern: '^[0-9]{1,10}$'
          description: Số nguyên dương truyền dưới dạng chuỗi. Giới hạn theo khổ phim lần lượt là 39, 16, 12, 10 và 1.
        devLabName:
          type: string
          minLength: 1
          maxLength: 150
        devChemistry:
          type: string
          minLength: 1
          maxLength: 50
        scannerModel:
          type: string
          maxLength: 150
        image:
          type: string
          format: binary
          description: Ảnh scan JPEG/JPG hoặc TIFF, tối đa 25 MiB, cạnh ngắn tối thiểu 2000 px.
        negativeProof:
          type: string
          format: binary
          description: Ảnh proof tuỳ chọn, tối đa 20 MiB.
    SubmissionComparison:
      type: object
      properties:
        submissionId:
          type: string
          format: uuid
        status:
          type: string
        isAiFlagged:
          type: boolean
        aiGeneratedProbability:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        phashHex:
          type: string
          nullable: true
        duplicateCheck:
          type: object
          properties:
            isSuspect:
              type: boolean
            suspectSubmissionId:
              type: string
              format: uuid
              nullable: true
            hammingDistance:
              type: integer
              nullable: true
            similarityScore:
              type: number
              nullable: true
        grainAnalysis:
          type: object
          properties:
            filmGrainScore:
              type: number
              nullable: true
            assessment:
              type: string
              nullable: true
        predictedTags:
          type: array
          items:
            type: object
        flagReasons:
          type: array
          items:
            type: string
        flaggedSubmission:
          type: object
        originalSubmission:
          type: object
          nullable: true
    Submission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contestId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        title:
          type: string
        imageOriginalPath:
          type: string
        negativeProofPath:
          type: string
          nullable: true
        fileSizeBytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        status:
          type: string
          example: PENDING_AI
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - Admin
          - Organizer
          - Judge
          - Participant
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - data
      - error
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
          enum:
          - null
        error:
          type: string
    SuccessEnvelope:
      type: object
      required:
      - code
      - message
      - data
      - error
      properties:
        code:
          type: integer
        message:
          type: string
        error:
          type: string
          nullable: true
          example: null
  responses:
    BadRequest:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu token hoặc token không hợp lệ / hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền truy cập endpoint này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SubmissionBadRequest:
      description: Dữ liệu multipart không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    ContestId:
      name: id
      in: path
      required: true
      description: UUID của cuộc thi
      schema:
        type: string
        format: uuid

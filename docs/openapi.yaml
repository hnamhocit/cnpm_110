      - BearerAuth: []
      x-implementation: mounted
      operationId: getAuthPortfolio
  /api/v1/auth/refresh:
    post:
      summary: Cấp mới Access Token bằng Refresh Token (Token Rotation)
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 6N7K4nFzD-example-token
      responses:
        '200':
          description: Cấp token mới thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
                        refreshToken:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token không hợp lệ hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implementation: mounted
      operationId: postAuthRefresh
  /api/v1/auth/register:
    post:
      summary: Đăng ký tài khoản mới (Participant)
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fullName
              - email
              - password
              properties:
                fullName:
                  type: string
                  maxLength: 100
                  example: Nguyễn Văn A
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: participant@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: SecurePass123!
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    code:
                      type: integer
                      example: 201
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/UserResponse'
                        accessToken:
                          type: string
                        refreshToken:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email đã được đăng ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implementation: mounted
      operationId: postAuthRegister
